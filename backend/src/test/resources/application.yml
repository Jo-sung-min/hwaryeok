spring:
  datasource:
    url: jdbc:h2:mem:hwaryeok;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: HwaryeokTestPool
      schema: public
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1500000
      keepalive-time: 120000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    create-schemas: true
    default-schema: public
    schemas: public

app:
  auth:
    jwt-secret: test-jwt-secret-with-at-least-thirty-two-bytes
    jwt-issuer: hwaryeok-api
    access-token-seconds: 900
    refresh-token-seconds: 2592000
    oauth-exchange-code-seconds: 120
  cors:
    allowed-origins: http://localhost:3000
