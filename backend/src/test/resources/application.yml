spring:
  datasource:
    url: jdbc:h2:mem:hwaryeok;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      schema: public
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    create-schemas: true
    default-schema: public
    schemas: public

app:
  auth:
    jwt-secret: test-jwt-secret-with-at-least-thirty-two-bytes
    jwt-issuer: hwaryeok-api
    access-token-seconds: 900
    refresh-token-seconds: 2592000
    oauth-exchange-code-seconds: 120
  cors:
    allowed-origins: http://localhost:3000
