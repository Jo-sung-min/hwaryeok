spring:
  application:
    name: hwaryeok-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hwaryeok}}
    username: ${DB_USER:${DB_USERNAME:hwaryeok}}
    password: ${DB_PASSWORD:hwaryeok}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:hwaryeok}
        format_sql: true
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:hwaryeok}
    schemas: ${DB_SCHEMA:hwaryeok}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    # JDBC URL에 민감한 연결 속성이 포함된 환경에서도 시작 로그에 노출하지 않습니다.
    org.hibernate.orm.connections.pooling: warn

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
