spring:
  application:
    name: hwaryeok-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hwaryeok}}
    username: ${DB_USER:${DB_USERNAME:hwaryeok}}
    password: ${DB_PASSWORD:hwaryeok}
    hikari:
      schema: ${DB_SCHEMA:hwaryeok}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:hwaryeok}
        format_sql: true
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:hwaryeok}
    schemas: ${DB_SCHEMA:hwaryeok}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    # JDBC URL에 민감한 연결 속성이 포함된 환경에서도 시작 로그에 노출하지 않습니다.
    org.hibernate.orm.connections.pooling: warn

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
    jwt-issuer: ${JWT_ISSUER:hwaryeok-api}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:2592000}
    oauth-exchange-code-seconds: ${OAUTH_EXCHANGE_CODE_SECONDS:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth:
    frontend-base-url: ${OAUTH_FRONTEND_BASE_URL:http://localhost:3000}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
