spring:
  application:
    name: hwaryeok-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hwaryeok}}
    username: ${DB_USER:${DB_USERNAME:hwaryeok}}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: ${DB_POOL_NAME:HwaryeokPool}
      schema: ${DB_SCHEMA:hwaryeok}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:hwaryeok}
        default_batch_fetch_size: 50
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${DB_SCHEMA:hwaryeok}
    schemas: ${DB_SCHEMA:hwaryeok}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    # JDBC URL에 민감한 연결 속성이 포함된 환경에서도 시작 로그에 노출하지 않습니다.
    org.hibernate.orm.connections.pooling: warn

app:
  auth:
    jwt-secret: ${JWT_SECRET:}
    license-hash-secret: ${LICENSE_HASH_SECRET:}
    jwt-issuer: ${JWT_ISSUER:hwaryeok-api}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:2592000}
    oauth-exchange-code-seconds: ${OAUTH_EXCHANGE_CODE_SECONDS:120}
    admin-emails: ${ADMIN_EMAILS:wings2530@gmail.com}
    login-rate-limit:
      window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:900}
      block-seconds: ${LOGIN_RATE_BLOCK_SECONDS:900}
      identity-attempts: ${LOGIN_RATE_IDENTITY_ATTEMPTS:8}
      address-attempts: ${LOGIN_RATE_ADDRESS_ATTEMPTS:100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  oauth:
    frontend-base-url: ${OAUTH_FRONTEND_BASE_URL:http://localhost:3000}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
