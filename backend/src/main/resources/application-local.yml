spring:
  datasource:
    url: jdbc:h2:mem:hwaryeok-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      schema: public
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    create-schemas: true
    default-schema: public
    schemas: public

server:
  servlet:
    session:
      cookie:
        secure: false

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    jwt-secret: local-development-secret-change-before-production-2026
    license-hash-secret: local-license-hash-secret-change-before-production-2026
