spring:
  datasource:
    url: jdbc:h2:mem:hwaryeok-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    create-schemas: true
    default-schema: public
    schemas: public

management:
  endpoint:
    health:
      show-details: always
