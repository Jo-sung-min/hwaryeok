plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hwaryeok'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'

    // 42.7.12 fixes CVE-2026-54291 (channelBinding=require downgrade) ahead of the Boot 4.1.0 BOM.
    runtimeOnly 'org.postgresql:postgresql:42.7.12'
    developmentOnly 'com.h2database:h2:2.3.232'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2:2.3.232'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    // 개발 서버는 별도 지정이 없을 때만 H2와 개발 전용 키가 있는 local 프로필을 사용합니다.
    // 운영 JAR 실행에는 적용되지 않으며, 프로세스 환경 변수와 .env의 명시적 프로필이 우선합니다.
    def configuredProfile = System.getenv('SPRING_PROFILES_ACTIVE')
    if (!configuredProfile) {
        def dotenvFile = [file('.env'), file('../.env')].find { it.exists() }
        configuredProfile = dotenvFile?.readLines('UTF-8')
                ?.find { it.trim().startsWith('SPRING_PROFILES_ACTIVE=') }
                ?.split('=', 2)
                ?.last()
                ?.trim()
    }
    environment 'SPRING_PROFILES_ACTIVE', configuredProfile ?: 'local'
}
