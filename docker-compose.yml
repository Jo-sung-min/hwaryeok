services:
  postgres:
    image: postgres:17-alpine
    container_name: hwaryeok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hwaryeok}
      POSTGRES_USER: ${DB_USER:-hwaryeok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hwaryeok}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - hwaryeok-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hwaryeok} -d ${DB_NAME:-hwaryeok}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hwaryeok-postgres-data:
