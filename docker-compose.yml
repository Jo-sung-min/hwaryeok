services:
  postgres:
    image: postgres:17-alpine
    container_name: hwaryeok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hwaryeok}
      POSTGRES_USER: ${DB_USER:-hwaryeok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - hwaryeok-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hwaryeok} -d ${DB_NAME:-hwaryeok}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-hwaryeok}
      DB_SCHEMA: ${DB_SCHEMA:-hwaryeok}
      DB_USER: ${DB_USER:-hwaryeok}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      CORS_ALLOWED_ORIGINS: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      OAUTH_FRONTEND_BASE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      LICENSE_HASH_SECRET: ${LICENSE_HASH_SECRET:?LICENSE_HASH_SECRET must be set}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_PRESIGNED_URL_SECONDS: ${S3_PRESIGNED_URL_SECONDS:-300}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080/api/v1
      OAUTH_BACKEND_URL: ${OAUTH_BACKEND_URL:-http://localhost:8081}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"

volumes:
  hwaryeok-postgres-data:
